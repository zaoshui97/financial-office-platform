# 前端 Nginx 配置（容器内）
#   - SPA 路由 fallback
#   - /api/ 反代到 backend:8000（容器网络别名）
#   - 静态资源长缓存 + HTML 不缓存

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 安全基础
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 通用 SPA fallback：找不到的文件落到 index.html，让前端 router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API；容器网络里 backend 是 service 名。
    # 注意：baseURL = /api/v1；前端实际请求 /api/v1/auth/login。
    # 这里把 /api/ 透传到 backend 的 /，让 FastAPI 看到 /api/v1/...
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # 长哈希文件：30 天缓存
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML：不缓存，确保升级版本后用户拿到最新版
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 健康检查（容器内）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}